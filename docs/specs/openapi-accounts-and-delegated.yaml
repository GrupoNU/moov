        updatedAt: '2027-01-21T11:05:00.000Z'
    AccountDeleting:
      summary: After DELETE — sessions gone, purge in progress; will answer 404 when done
      value:
        address: expo-diseno-2026@eventos.example.test
        domain: eventos.example.test
        name: Expo Diseño 2026
        state: deleting
        readOnly: true
        suspended: false
