        quota: { limitMB: 2048, usedBytes: 201326592, messages: 1391 }
        limits: { sendPerDay: 300, recipientsPerMessage: 50, attachmentMB: 25 }
        sync: { state: paused, lastSyncAt: '2027-01-20T03:00:11.000Z', messages: 1391 }
