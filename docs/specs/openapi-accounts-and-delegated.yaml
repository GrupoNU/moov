        lastAccessAt: '2026-10-22T09:40:55.310Z'
        readOnlySince: null
        suspendedAt: null
        deletingSince: null
        createdAt: '2026-10-01T14:03:12.418Z'
        updatedAt: '2026-10-01T14:03:12.418Z'
    AccountReadOnly:
      summary: Retention phase — reading and export work, sending is blocked
      value:
        address: expo-diseno-2026@eventos.example.test
        domain: eventos.example.test
        name: Expo Diseño 2026
        state: readonly
        readOnly: true
        suspended: false
        quota: { limitMB: 2048, usedBytes: 201326592, messages: 1391 }
        limits: { sendPerDay: 300, recipientsPerMessage: 50, attachmentMB: 25 }
        sync: { state: ready, lastSyncAt: '2027-01-14T03:00:11.000Z', messages: 1391 }
        lastAccessAt: '2027-01-10T16:12:40.000Z'
        readOnlySince: '2027-01-14T03:00:00.000Z'
