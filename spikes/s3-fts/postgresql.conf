# Moov Mail — Spike S3 PostgreSQL 17 tuning.
# Box: 8 vCPU / 23 GB RAM, NVMe SSD. Container capped at --cpus=6 --memory=12g.
# Values are the ones prescribed by the spike brief; recorded here verbatim so
# the run is reproducible.

listen_addresses = '*'

shared_buffers = 4GB
effective_cache_size = 12GB
maintenance_work_mem = 2GB
work_mem = 64MB

max_parallel_workers_per_gather = 4
max_parallel_workers = 6
max_worker_processes = 8

max_wal_size = 8GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9

# SSD: random access is nearly as cheap as sequential, and concurrent I/O pays.
random_page_cost = 1.1
effective_io_concurrency = 200

shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = 'all'

# Benchmark instrumentation.
track_io_timing = on
log_min_duration_statement = 10000
log_checkpoints = on
