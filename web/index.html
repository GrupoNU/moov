<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!--
      The title and theme-color are replaced at runtime by the resolved brand
      (applyBrandingToDocument). These are the pre-brand values: Moov's own,
      which is also the correct final value for every unbranded installation.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Moov Mail</title>
    <meta name="theme-color" content="#5b5bd6" />
    <meta name="description" content="Moov Mail" />

    <!--
      A login page must never be indexed or previewed by a crawler: it is a
      credential prompt, and a cached copy of a customer's branded login screen
      is a phishing template someone else did not have to build.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="same-origin" />

    <script>
      /*
       * Applies the stored theme BEFORE first paint.
       *
       * This is the one piece of logic that must run as a blocking inline
       * script rather than from the bundle: by the time a module script
       * executes, the browser has already painted, so a user with dark mode
       * selected would see a white flash on every load. Inline and synchronous
       * in <head> is the only placement that prevents it.
       *
       * It mirrors theme.ts exactly, INCLUDING the default: three states, and
       * "system" removes the attribute so prefers-color-scheme decides. Any
       * other value — including no stored value at all — is the DEFAULT_THEME
       * of theme.ts, which is "light".
       *
       * That last clause is the whole point. If this script fell through to
       * "stamp nothing" when nothing is stored, a first-time visitor on a dark
       * OS would be painted dark by the media query and then corrected to
       * light once the bundle ran — a flash of the wrong theme, which is
       * precisely what this script exists to prevent. Stamping the default
       * explicitly makes the pre-paint answer and the React answer identical.
       *
       * Wrapped in try/catch because a blocked localStorage must not stop the
       * page from loading; the catch falls back to the same default.
       */
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("moov.theme.v1");
        } catch (error) {
          /* Storage is blocked; the default below applies. */
        }
        if (stored === "system") {
          document.documentElement.removeAttribute("data-theme");
        } else {
          document.documentElement.setAttribute(
            "data-theme",
            stored === "dark" ? "dark" : "light",
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Moov Mail necesita JavaScript para funcionar. / Moov Mail requires
      JavaScript to run.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
