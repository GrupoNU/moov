<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!--
      The title and theme-color are replaced at runtime by the resolved brand
      (applyBrandingToDocument). These are the pre-brand values: Moov's own,
      which is also the correct final value for every unbranded installation.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/branding/icons/favicon-32.png" />
    <title>Moov Mail</title>
    <meta name="theme-color" content="#5b5bd6" />
    <meta name="description" content="Moov Mail" />

    <!--
      E9 / decision D-1: Moov is an installable PWA. The manifest is what makes
      the browser offer installation, what names and paints the installed
      window, and what registers `mailto:` so the OS can hand a compose to us
      (see src/pwa/mailto.ts for the receiving half).

      # Why these three point at /branding and not at /public

      An installed app is the one surface a customer cannot rebrand after the
      fact: the name under the home-screen icon and the icon itself are baked
      in at install time, and nothing in the running app can correct them. So
      the shell links the SERVER-RESOLVED variants, which the server answers
      per Host header — a branded host installs as that customer, an
      unbranded host gets Moov's own bytes, indistinguishably.

      The static `public/manifest.webmanifest` and `public/icons/*` stay on
      disk unchanged: they are what the Go server embeds and serves as the
      unbranded default, and a Go test pins them byte-for-byte against these
      files. They are the source, not dead weight.

      `apple-touch-icon` is separate because iOS still does not read the
      manifest's icons for a home-screen bookmark; without this line an
      installed Moov on iOS gets a screenshot of the page as its icon. It is a
      PNG with opaque corners on purpose — iOS discards alpha and would
      otherwise composite the rounded plate onto black.

      The favicon is a PNG rather than the `public/favicon.svg` that used to be
      linked here for the same reason: there is no per-host SVG to serve, and a
      tab showing Moov's mark next to a customer's branded login screen is the
      one place the seam is visible on every single page load. The SVG stays on
      disk as the asset the server's own favicon is rendered from.
    -->
    <link rel="manifest" href="/branding/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/branding/icons/apple-touch-icon.png" />

    <!--
      A login page must never be indexed or previewed by a crawler: it is a
      credential prompt, and a cached copy of a customer's branded login screen
      is a phishing template someone else did not have to build.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="same-origin" />

    <script>
      /*
       * Applies the stored theme BEFORE first paint.
       *
       * This is the one piece of logic that must run as a blocking inline
       * script rather than from the bundle: by the time a module script
       * executes, the browser has already painted, so a user with dark mode
       * selected would see a white flash on every load. Inline and synchronous
       * in <head> is the only placement that prevents it.
       *
       * It mirrors theme.ts exactly, INCLUDING the default: three states, and
       * "system" removes the attribute so prefers-color-scheme decides. Any
       * other value — including no stored value at all — is the DEFAULT_THEME
       * of theme.ts, which is "light".
       *
       * That last clause is the whole point. If this script fell through to
       * "stamp nothing" when nothing is stored, a first-time visitor on a dark
       * OS would be painted dark by the media query and then corrected to
       * light once the bundle ran — a flash of the wrong theme, which is
       * precisely what this script exists to prevent. Stamping the default
       * explicitly makes the pre-paint answer and the React answer identical.
       *
       * Wrapped in try/catch because a blocked localStorage must not stop the
       * page from loading; the catch falls back to the same default.
       */
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("moov.theme.v1");
        } catch (error) {
          /* Storage is blocked; the default below applies. */
        }
        if (stored === "system") {
          document.documentElement.removeAttribute("data-theme");
        } else {
          document.documentElement.setAttribute(
            "data-theme",
            stored === "dark" ? "dark" : "light",
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Moov Mail necesita JavaScript para funcionar. / Moov Mail requires
      JavaScript to run.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
