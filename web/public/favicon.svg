<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Moov Mail">
  <!--
    Moov's mark as a favicon: the same rounded plate and continuous "M" stroke
    the app draws inline (components/BrandMark.tsx), so the tab icon and the
    in-app logo are one design rather than two that drifted.

    An SVG favicon is safe here in a way an SVG BRAND ASSET is not: this file is
    ours, ships in the bundle, and is never uploaded by a customer — which is
    exactly the distinction internal/jmaphttp/branding.go draws when it refuses
    customer-supplied SVG.

    The colours are literal rather than tokens: a favicon is fetched by the
    browser outside the page, where CSS custom properties do not exist. A
    customer's own brand replaces the tab icon through the theme-color meta and,
    in a later epic, the PWA manifest.
  -->
  <rect width="32" height="32" rx="8.5" fill="#5b5bd6"/>
  <path d="M9 22V11.4c0-.5.6-.7.9-.3l5.4 6.6c.35.43 1 .43 1.35 0l5.4-6.6c.32-.4.95-.17.95.33V22"
        fill="none" stroke="#ffffff" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
