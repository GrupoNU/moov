      A correct parser stops consuming at the end of the valid base64 stream and
      ignores the surplus padding, recovering "padding matters" byte-for-byte. The
      excess '=' carries no data, so full recovery is the only acceptable outcome.
      Emitting a warning is fine; emitting an empty body is not.
    subject: "base64 with excess padding"
    parts: 1
    attachments: 0

  - id: cte-006
    file: 06-cte/006-qp-bare-equals-eof.eml
    category: cte
    pathology: >
      Quoted-printable body ending in a bare '=' with nothing after it — a soft
      line break truncated at EOF, exactly what happens when an MTA or a storage
      layer clips the last bytes of a message.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      Both lines of text must be recovered. The first '=' at end-of-line is a
      legitimate soft break and MUST be removed, joining the two lines into one
      logical line. The final dangling '=' at EOF is undecodable; a correct parser
      either drops it silently or preserves it literally — both are defensible and
      neither loses meaningful content. What must not happen is aborting the QP
      decode and returning nothing.
    subject: "QP with a bare = at EOF"
    parts: 1
    attachments: 0

  - id: cte-007
    file: 06-cte/007-qp-lowercase-hex.eml
    category: cte
    pathology: >
      Quoted-printable escapes written with lowercase hex digits (=c3=b1)
      alongside the canonical uppercase form; RFC 2045 says encoders MUST use
      uppercase, and a decoder that enforces that requirement mangles every
      accented character produced by a large family of real MUAs.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      Decoders are required to accept both cases. A correct parser produces
      "señor with lowercase hex, señor with uppercase." — the two halves of the
      line must decode identically. Any output where the lowercase escapes survive
      as literal "=c3=b1" text is a defect.
    subject: "QP with lowercase hex digits"
    parts: 1
    attachments: 0

  - id: cte-008
    file: 06-cte/008-qp-invalid-escapes.eml
    category: cte
    pathology: >
      Quoted-printable body with several illegal escapes (=ZZ, =G1, '=' followed
      by a space) plus trailing whitespace before a soft line break; strict
      decoders error out on the first bad escape and lose the following lines.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: partial
    expect_notes: >
      A correct parser recovers all three lines. Per RFC 2045 §6.7 note 3, a
      malformed escape SHOULD be left in place as literal text rather than
      aborting, so "=ZZ", "=G1" and "= " appear verbatim in the output — that
      literal passthrough is the conforming result. The trailing whitespace before
      the soft break MUST be stripped and the soft break MUST join its line to
      "final line.". Marked partial because the decoder necessarily guesses at the
      author's intent for the invalid escapes (literal passthrough vs. dropping
      them); both are defensible, but dropping the rest of the body is not.
    subject: "QP with invalid escape sequences"
    parts: 1
    attachments: 0

  - id: cte-009
    file: 06-cte/009-binary-declared-7bit.eml
    category: cte
    pathology: >
      An application/octet-stream attachment containing all 256 byte values —
      NULs, control characters and high bytes — while declaring
      Content-Transfer-Encoding: 7bit; the NUL bytes in particular cannot be
      stored in a PostgreSQL text column, so this is a storage-layer hazard as
      much as a parsing one.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      7bit is an identity transform, so the correct parser passes the body through
      untouched and delivers all 256 bytes as the attachment payload, with
      filename "blob.bin". Because the content is a binary attachment (not text),
      the bytes must be stored as a blob, never coerced into a text column — NUL
      stripping would corrupt the attachment. Truncating the body at the first NUL
      is the failure to watch for. Note the embedded CR/LF bytes (0x0D/0x0A) are
      part of the payload, so a line-oriented reader may mis-split the body; a
      correct implementation reads the part as bytes.
    subject: "Binary content declared 7bit"
    parts: 1
    attachments: 1

  - id: cte-010
    file: 06-cte/010-unknown-cte-value.eml
    category: cte
    pathology: >
      Content-Transfer-Encoding: x-uuencode — an unregistered encoding token —
      wrapping a uuencoded blob; RFC 2045 §6.4 requires unrecognized encodings to
      be treated as opaque application/octet-stream rather than silently assumed
      to be 8bit.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      No data is lost either way: the correct parser does not attempt to decode an
      unknown token and hands the raw body through. Two defensible behaviors —
      (a) strict RFC 2045: demote the part to application/octet-stream and offer
      it as a download rather than rendering it as text/plain; (b) pragmatic:
      render the raw bytes as the declared text/plain, which shows the user the
      literal "begin 644 file.txt ... end" block. Either is acceptable; both must
      preserve every byte. Decoding uuencode is a bonus, not a requirement.
    subject: "Unknown Content-Transfer-Encoding"
    parts: 1
    attachments: 0

  - id: cte-011
    file: 06-cte/011-cte-base64-on-multipart.eml
    category: cte
    pathology: >
      Content-Transfer-Encoding: base64 on a multipart/mixed container, which RFC
      2045 §6.4 forbids outright (composite types may only carry 7bit/8bit/binary);
      a parser that honours the header base64-decodes the boundary structure
      itself and loses every child part.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      The correct parser IGNORES the illegal CTE on the composite part, walks the
      boundary structure normally, and yields the single text/plain child with
      body "the container claims to be base64 encoded". Attempting the base64
      decode of the container body destroys the message and must not happen —
      the RFC's prohibition means the header is meaningless, not authoritative.
    subject: "base64 CTE on a multipart container"
    parts: 1
    attachments: 0

  - id: cte-012
    file: 06-cte/012-duplicate-cte-disagree.eml
    category: cte
    pathology: >
      Two Content-Transfer-Encoding headers on the same part declaring base64 and
      7bit respectively; RFC 5322 permits at most one, so the parser must pick,
      and the two choices produce completely different bodies from identical bytes.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: partial
    expect_notes: >
      The body is valid base64 for "which encoding header wins?". Two defensible
      behaviors: take the FIRST occurrence (the near-universal convention for
      duplicated headers, and the one that recovers the plaintext here), or take
      the last / treat the duplication as unreliable and fall back to 7bit
      (yielding the literal base64 string). First-wins is preferred because it
      recovers the meaningful content; the fallback is acceptable because no bytes
      are lost, only left encoded. Marked partial because the parser is forced to
      guess. An empty body, or dropping the part on the conflict, is wrong.
    subject: "Two disagreeing CTE headers"
    parts: 1
    attachments: 0

  - id: cte-013
    file: 06-cte/013-b64-unfolded-long-line.eml
    category: cte
    pathology: >
      A ~11 KB base64 payload emitted as a single unfolded line, violating the
      76-character limit of RFC 2045 §6.8; parsers or line readers with a fixed
      line-buffer cap truncate the body mid-stream, and the same shape at
      megabyte scale is what real MUAs produce for large attachments.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      Line length is a wire-format recommendation, not a decoding constraint. A
      correct parser decodes the full stream and recovers the payload
      ("Moov corpus payload. " repeated 400 times, 8400 bytes) intact. Any
      truncation caused by a scanner line limit is a defect; the reader must be
      buffer-limit-free or chunked.
    subject: "base64 as one very long line"
    parts: 1
    attachments: 0

  - id: cte-014
    file: 06-cte/014-b64-one-char-per-line.eml
    category: cte
    pathology: >
      Base64 folded to exactly one character per line, so every 4-character
      quantum spans four physical lines; decoders that assume line boundaries
      align with quantum boundaries, or that decode line-by-line, produce garbage
      or fail on every line.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      RFC 2045 requires all whitespace, including line breaks, to be discarded
      before decoding. A correct parser strips the CRLFs and recovers
      "one character per line" exactly. Per-line decoding is the bug this case
      exists to catch.
    subject: "base64 folded to one character per line"
    parts: 1
    attachments: 0

  - id: structural-001
    file: 07-structural/001-headers-only-no-body.eml
    category: structural
    pathology: >
      A complete, well-formed header block with no terminating blank line and no
      body at all; IMAP FETCH of a message stored this way is common after
      truncation, and a parser expecting a header/body separator may treat the
      last header line as body or fail to terminate.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      End-of-input is a valid terminator for a header block. A correct parser
      reads all seven headers — including Content-Type: text/plain — and yields a
      single leaf part with an empty body. The empty body here is correct and is
      NOT data loss; the failure to watch for is losing the final Content-Type
      header because it lacks a trailing blank line, or rejecting the message.
    subject: "Headers only, no body"
    parts: 1
    attachments: 0

  - id: structural-002
    file: 07-structural/002-empty-file.eml
    category: structural
    pathology: >
      A zero-byte file where a message should be — the shape produced by an
      interrupted APPEND, a failed download, or a truncated store; there is
      nothing at all to parse.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: failed
    expect_notes: >
      No parser can extract meaningful structure from zero bytes; this is the one
      genuinely hopeless case in the category. The requirement is that the parser
      fail CLEANLY — return an explicit error or an empty-message sentinel — and
      never panic, hang, or return a partially-initialized message struct that
      downstream code mistakes for a real message. The sync engine should treat
      this as a fetch failure and retry, not as a successfully synced empty
      message.
    attachments: 0

  - id: structural-003
    file: 07-structural/003-blank-line-only-body.eml
    category: structural
    pathology: >
      Header block correctly terminated, followed by a body consisting of exactly
      one empty line; the ambiguity is whether the second CRLF is the separator or
      body content, and an off-by-one here shifts every subsequent byte.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      The first CRLF after the last header terminates the header block; everything
      after it is the body, so the correct body is a single CRLF (or, equivalently
      after line normalization, one empty line). A parser that reports a
      zero-length body is also defensible in practice since the content is
      semantically empty, but it must not consume the separator into the header
      block or emit a parse error. Snippet generation must handle the empty result
      without crashing.
    subject: "Body is a single blank line"
    parts: 1
    attachments: 0

  - id: structural-004
    file: 07-structural/004-multipart-no-boundary-param.eml
    category: structural
    pathology: >
      Content-Type: multipart/mixed with no boundary parameter, so there is no
      delimiter to split on; a parser that dispatches on the top-level type and
      then looks for a boundary can loop, return zero parts, or discard the entire
      body as unparseable preamble.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      The declared multipart is uninterpretable, so a correct parser degrades
      gracefully: treat the part as a leaf and expose the whole body as text
      (effectively text/plain), preserving "There is no boundary parameter, so
      there is nothing to split on." Returning a multipart with zero children and
      an unreachable body is the failure mode — the user would see a blank
      message. Whether the part is reported as text/plain or as
      application/octet-stream is a defensible choice; losing the bytes is not.
    subject: "multipart without a boundary parameter"
    parts: 1
    attachments: 0

  - id: structural-005
    file: 07-structural/005-text-plain-with-boundary.eml
    category: structural
    pathology: >
      A text/plain part carrying a meaningless boundary= parameter, with lines in
      the body that look exactly like delimiters; a parser that keys off the
      presence of "boundary=" instead of the top-level type will try to split a
      leaf and fabricate phantom parts.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      Only a top-level type of "multipart" makes a part composite. The correct
      result is one leaf text/plain part whose body is the three literal lines
      including "--=_t_=" and "--=_t_=--" as ordinary text. Any output containing
      child parts is wrong.
    subject: "text/plain with a boundary parameter"
    parts: 1
    attachments: 0

  - id: structural-006
    file: 07-structural/006-attachment-only-no-text.eml
    category: structural
    pathology: >
      A message whose entire body is a single base64 PDF attachment with no text
      part anywhere; the list view still needs a preview snippet and the search
      index still needs something to index, so "no text body" must be a supported
      state rather than an error.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      The correct parse is one leaf part, application/pdf, disposition attachment,
      filename "informe.pdf", base64-decoded to the payload bytes. Text body and
      HTML body are both legitimately absent — the snippet must fall back to
      something derived (subject, filename, or empty), not to a parse error. The
      top-level Content-Type being a non-multipart attachment is legal and must
      not be mistaken for a malformed multipart.
    subject: "Attachment only, no text part"
    parts: 1
    attachments: 1

  - id: structural-007
    file: 07-structural/007-disposition-contradictions.eml
    category: structural
    pathology: >
      A multipart/related where an image/png marked "attachment" carries a
      Content-ID referenced by the sibling HTML (so it is really inline), and an
      application/zip is marked "inline" with a filename (so it is really an
      attachment); trusting Content-Disposition alone shows the logo twice or
      hides the zip from the attachment list.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      Three leaf parts must be recovered intact: text/html, image/png (with
      Content-ID logo@example.com), application/zip (filename archivo.zip). The
      correct policy is that a Content-ID actually referenced by a cid: URL in a
      sibling body overrides disposition=attachment — the PNG is rendered inline
      and SHOULD NOT be listed as a user-facing attachment. Conversely,
      disposition=inline on a non-renderable type (application/zip) with a
      filename must be surfaced as an attachment regardless of the label. The
      attachments count below reflects that policy (zip only); a parser that
      reports 2 attachments by literal disposition is defensible at the parse
      layer as long as the presentation layer applies the cid: rule.
    subject: "Contradictory dispositions"
    parts: 3
    attachments: 1

  - id: structural-008
    file: 07-structural/008-filename-name-vs-filename.eml
    category: structural
    pathology: >
      Content-Type name= says "factura.pdf" while Content-Disposition filename=
      says "factura.pdf.exe" — the two sources disagree on the EXTENSION, which is
      precisely the shape of a real-world attachment-spoofing attack.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      Per RFC 2183, Content-Disposition filename= is the authoritative source for
      the presented filename and MUST win over the deprecated Content-Type name=;
      the correct filename is therefore "factura.pdf.exe". SECURITY: because the
      two sources disagree on the extension, this is a spoofing indicator, not a
      cosmetic conflict — a client that displays name= ("factura.pdf") while
      saving filename= (".exe") lets the user execute a binary they believe is a
      document. A correct implementation shows the same string it saves, uses the
      filename= form, and should flag the disagreement. Both strings must be
      retained in the parse result so the discrepancy is detectable downstream.
    subject: "name= and filename= disagree"
    parts: 1
    attachments: 1

  - id: structural-009
    file: 07-structural/009-rfc2231-continuation-correct.eml
    category: structural
    pathology: >
      A correctly formed RFC 2231 parameter: filename split across three
      continuation segments (filename*0*, filename*1*, filename*2) with UTF-8
      percent-encoding and a charset prefix — the well-formed control case that
      parsers relying on plain filename= silently render as a truncated or empty
      name.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      The three segments must be concatenated in index order and the percent-
      escapes decoded against the declared UTF-8 charset, producing exactly
      "Informe de gestión año 2025.pdf". Note the third segment is filename*2
      (no trailing asterisk) and therefore is NOT percent-decoded — it contributes
      the literal ".pdf"; mixing encoded and unencoded segments is legal and a
      parser that percent-decodes all segments uniformly happens to get the same
      answer here only because ".pdf" contains no '%'. Any result showing raw
      "%C3%B3" or only the first segment is a defect.
    subject: "RFC 2231 continuation, correct"
    parts: 1
    attachments: 1

  - id: structural-010
    file: 07-structural/010-rfc2231-wrong-charset.eml
    category: structural
    pathology: >
      An RFC 2231 filename* whose percent-escaped bytes are UTF-8 while the
      parameter's charset prefix declares ISO-8859-1; decoding as declared yields
      mojibake in the filename the user sees and saves.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: partial
    expect_notes: >
      Strictly conforming decoding honours the declared charset and produces
      "Informe gestiÃ³n.pdf" — mojibake, and that IS the conforming result for
      this input. A robust implementation may additionally notice that the
      percent-decoded byte sequence is valid UTF-8 and prefer the UTF-8 reading
      ("Informe gestión.pdf"); this heuristic is defensible and is what most
      modern clients do. Marked partial because the parser must guess between a
      correct-but-wrong-looking name and a heuristically-repaired one. Either
      outcome is acceptable; an empty or dropped filename is not.
    subject: "RFC 2231 with wrong charset label"
    parts: 1
    attachments: 1

  - id: structural-011
    file: 07-structural/011-rfc2231-gap-and-disorder.eml
    category: structural
    pathology: >
      RFC 2231 continuation segments present as filename*2 and filename*0 with
      index 1 missing and the segments written out of order; naive concatenation
      in header order yields "-final.pdfprimero" and a missing-index parser may
      abandon the filename entirely.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: partial
    expect_notes: >
      A correct parser sorts segments by index rather than by header order, so the
      order defect is fully recoverable. The GAP is not: index 1 is genuinely
      absent and no parser can reconstruct it. The best achievable result is
      "primero-final.pdf" — concatenating the present segments in index order and
      accepting the hole. Also defensible: stopping at the gap and yielding
      "primero" (RFC 2231 arguably makes a continuation invalid once broken). Both
      lose information, hence partial. Concatenating in header order
      ("-final.pdfprimero") is wrong, and dropping the filename entirely — leaving
      an unnamed attachment — is the worst outcome.
    subject: "RFC 2231 continuation with a gap"
    parts: 1
    attachments: 1

  - id: structural-012
    file: 07-structural/012-rfc2231-and-plain-disagree.eml
    category: structural
    pathology: >
      The same Content-Disposition carries both filename="inocuo.txt" and
      filename*=UTF-8''peligroso.exe; the two forms disagree on the EXTENSION, so
      which one the client honours decides whether the user believes they are
      opening a text file or an executable.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      RFC 2231 §4 is explicit: when both an encoded (filename*) and an unencoded
      (filename=) form of the same parameter are present, the ENCODED form wins.
      The correct filename is therefore "peligroso.exe". SECURITY: this is the
      canonical extension-spoofing construction — a sender who knows the target
      client prefers the plain form can display "inocuo.txt" while a
      2231-conforming client saves ".exe", or vice versa. The implementation must
      display and save the same string (the filename* form) and should flag the
      disagreement; both values must be preserved in the parse result so the
      mismatch is detectable. Any behavior where the shown name and the saved name
      differ is a security defect, not a cosmetic one.
    subject: "filename* and filename= disagree"
    parts: 1
    attachments: 1

  - id: structural-013
    file: 07-structural/013-filename-traversal-and-controls.eml
    category: structural
    pathology: >
      Attachment filename is "../../../etc/passwd" — a path-traversal payload
      delivered through a header field that naive code passes straight to
      filepath.Join or a Content-Disposition download header.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      The parser's job is faithful extraction: report the filename exactly as sent,
      "../../../etc/passwd", without normalizing or rejecting it — silently
      rewriting it at parse time would hide the attack from auditing. SECURITY:
      sanitization belongs at every USE site — take only the base name for display,
      never use the value as a filesystem path or as a blob key, and escape it when
      emitting a Content-Disposition response header. A blob store addressed by
      sha256 (as in ADR-001) sidesteps the filesystem risk entirely; the remaining
      exposure is the download header and the UI. Expect ok because nothing is lost
      or guessed — this case tests downstream handling, not parsing.
    subject: "Filename with traversal and control chars"
    parts: 1
    attachments: 1

  - id: structural-014
    file: 07-structural/014-alternative-inverted-order.eml
    category: structural
    pathology: >
      A multipart/alternative with the text/html part first and text/plain last,
      inverting the RFC 2046 convention that parts appear in increasing order of
      faithfulness; a "take the last part" selector picks the plain text and
      throws away the rich version the sender intended.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      Both leaf parts must be parsed and RETAINED — the correct behavior for a
      sync engine is to store every alternative and choose at render time, so
      nothing is lost regardless of the ordering. For selection, the robust rule is
      to pick by capability (prefer text/html when the client can render it, keep
      text/plain as the fallback and for indexing) rather than by position, which
      makes this message render as HTML. A strict RFC 2046 "last part wins" reading
      is defensible and yields the plain text; it is not data loss because the HTML
      is still stored. Discarding either alternative at parse time is the defect.
    subject: "multipart/alternative in inverted order"
    parts: 2
    attachments: 0

  - id: structural-015
    file: 07-structural/015-empty-parts.eml
    category: structural
    pathology: >
      A multipart/mixed containing a completely empty part (two consecutive
      delimiters, no headers at all) and a part with headers but a zero-length
      body, before the one part with real content; iterators that assume every
      delimiter is followed by a header block can desynchronize and drop the
      remaining parts.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      The correct parse yields three children in order: an empty part (no headers,
      no body, defaulting to text/plain us-ascii per RFC 2046), a text/plain part
      with an empty body, and a text/plain part with body "the only part with
      actual content". The load-bearing requirement is that iteration survives the
      empty parts and reaches the third — losing the real content is the failure
      this case exists to catch. Whether empty parts are emitted as children or
      silently skipped is a defensible implementation choice; the parts count below
      assumes they are emitted.
    subject: "Empty parts inside a multipart"
    parts: 3
    attachments: 0

  - id: structural-016
    file: 07-structural/016-rfc822-part-not-a-message.eml
    category: structural
    pathology: >
      A part declared message/rfc822 whose payload is binary garbage with NUL
      bytes rather than an RFC 5322 message; a parser that recurses into
      message/rfc822 unconditionally can error out, recurse on nonsense, or lose
      the enclosing multipart.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      The correct behavior is to attempt the nested parse, detect that the payload
      has no valid header block, and fall back to treating the part as an opaque
      leaf whose raw bytes are preserved — the enclosing multipart/mixed and its
      single child must survive intact. A nested-parse failure must never
      invalidate the parent message. Note the payload begins with NUL bytes, so
      the bytes must be handled as binary (blob), not coerced into a text column.
      A defensible alternative is to synthesize an empty nested message with the
      raw bytes attached; unacceptable is an error that drops the whole message.
    subject: "message/rfc822 containing non-message data"
    parts: 1
    attachments: 0

  - id: structural-017
    file: 07-structural/017-mime-structure-without-mime-version.eml
    category: structural
    pathology: >
      A full multipart/mixed structure with no MIME-Version header; RFC 2045
      strictly requires the header before Content-Type may be interpreted as MIME,
      yet a huge volume of real mail omits it and every deployed client honours
      the structure anyway.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      The pragmatic and correct behavior is to honour the Content-Type regardless
      of MIME-Version and parse the multipart normally, yielding one text/plain
      leaf with body "body". A strictly conforming parser would treat the whole
      thing as an unstructured text/plain body containing visible boundary lines —
      technically defensible per RFC 2045 §4, but it degrades real mail for no
      benefit and must not be the default. Either way nothing is lost, so expect
      ok; the parts count below assumes MIME interpretation.
    subject: "MIME structure with no MIME-Version"
    parts: 1
    attachments: 0

  - id: real-world-001
    file: 09-real-world/001-tnef-winmail-dat.eml
    category: real-world
    pathology: >
      Outlook TNEF: a multipart/mixed whose second part is an application/ms-tnef
      "winmail.dat" carrying the real formatted body and any real attachments in a
      proprietary container, here with a valid TNEF signature and a truncated
