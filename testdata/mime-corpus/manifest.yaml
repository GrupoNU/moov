  - id: cte-003
    file: 06-cte/003-b64-interleaved-garbage.eml
    category: cte
    pathology: >
      A valid base64 payload with a space, a '!' and a '@' injected mid-stream:
      RFC 2045 requires whitespace to be ignored but says nothing usable about
      stray non-alphabet bytes, so strict decoders abort on the first '!' and
      lose the entire attachment or body.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: partial
    expect_notes: >
      A correct parser MUST skip the embedded whitespace (legal per RFC 2045) and
      should skip the '!' and '@' rather than abort, decoding the remaining
      alphabet characters. Because two non-alphabet bytes were inserted rather
      than substituted, the surviving stream is no longer 4-character aligned at
      the injection points, so the tail typically decodes with a byte-level shift:
      the leading portion ("payload with interle...") is recoverable, some of the
      remainder is corrupt. Partial is the honest expectation — usable content is
      recovered but some bytes are unrecoverable by any parser. Aborting with an
      empty body is wrong; so is silently reporting success on corrupt bytes
      without any indication.
    subject: "base64 with interleaved invalid characters"
    parts: 1
    attachments: 0

