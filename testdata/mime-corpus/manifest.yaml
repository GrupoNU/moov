  - id: real-world-002
    file: 09-real-world/002-smime-mangled-signature.eml
    category: real-world
    pathology: >
      An S/MIME multipart/signed whose application/pkcs7-signature part is
      corrupt — neither valid base64 nor valid PKCS#7 — so a parser that validates
      the signature before rendering, or that aborts on the failed base64 decode,
      costs the user a perfectly readable message because of a broken signature.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      The load-bearing expectation: the signed CONTENT must remain fully readable.
      The text/plain first part ("This is the signed content and it must remain
      readable.") must be extracted and rendered exactly as if the message were
      unsigned. The corrupt signature part must degrade to "signature could not be
      verified" — never to a parse failure, an empty body, or a dropped message. A
      broken signature must never cost the user the message body. Presentation
      rule: per RFC 1847 the application/pkcs7-signature part is protocol
      machinery, not user content, and MUST NOT be listed as a downloadable
      attachment (hence attachments: 0), though it must still be retained
      byte-for-byte in the store for later re-verification. Failing the base64
      decode of the signature is expected and harmless.
    subject: "multipart/signed with mangled signature"
    parts: 2
    attachments: 0

  - id: real-world-003
    file: 09-real-world/003-pgpmime-missing-control-part.eml
    category: real-world
    pathology: >
      A PGP/MIME multipart/encrypted that violates RFC 3156 by omitting the
      mandatory application/pgp-encrypted control part, leaving only the ciphertext
      part; a parser that indexes by position (control = part 0, ciphertext =
      part 1) reads the ciphertext as the control part and reports the message as
      malformed rather than as encrypted.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: partial
    expect_notes: >
      The single application/octet-stream child must be parsed and its bytes
      preserved verbatim — the ASCII-armored block from "-----BEGIN PGP MESSAGE-----"
      through "-----END PGP MESSAGE-----" — because that is the only copy of the
      user's content and it is still decryptable by an external tool given the
      right key. Marked partial because the plaintext is inherently unavailable to
      the parser (the payload here is synthetic and undecryptable in any case) and
      the missing control part means the protocol declaration cannot be verified.
      Correct behavior: identify the part by its PGP armor rather than by position,
      present the message as encrypted, and offer the armored block. A broken
      crypto envelope must not cost the user the ciphertext — dropping the part or
      rendering a blank message is the failure to avoid.
    subject: "multipart/encrypted missing its control part"
    parts: 1
    attachments: 0

  - id: real-world-004
    file: 09-real-world/004-dsn-delivery-status.eml
    category: real-world
    pathology: >
      A bounce shaped as multipart/report; report-type=delivery-status containing a
      message/delivery-status part and a message/rfc822 part whose returned
      original was truncated by the MTA mid-body; the nested truncated message is
      what breaks recursive parsers, and bounces are high-volume traffic that must
      be classified reliably.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      All three children must be recovered: the human-readable text/plain
      explanation, the message/delivery-status part whose per-recipient fields
      (Final-Recipient nosuchuser@example.org, Action failed, Status 5.1.1) should
      be parsed as header-style key/value groups rather than treated as opaque
      text, and the message/rfc822 part containing the truncated original. The
      nested message has a valid header block and a body of "original bo"; its
      truncation is not an error condition — a correct parser accepts an
      end-of-input body. Counting: the delivery-status and rfc822 parts are
      protocol content, not user attachments, so a correct client shows zero
      attachments and renders the text/plain explanation as the body. The parts
      count below counts the three top-level children as leaves (the nested
      message's own single text body is not counted separately).
    subject: "Undelivered Mail Returned to Sender"
    parts: 3
    attachments: 0

  - id: real-world-005
    file: 09-real-world/005-calendar-broken-folding.eml
    category: real-world
    pathology: >
      A multipart/alternative meeting invite whose text/calendar part violates RFC
      5545 folding: a SUMMARY continuation line lacks the required leading space
      (so it parses as an unknown property) and a DESCRIPTION escape is split
      across a fold; broken invites are endemic and a strict iCalendar parser
      rejects the whole VEVENT.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: partial
    expect_notes: >
      MIME-level parsing must fully succeed — two leaf parts, text/plain
      ("Reunion de equipo") and text/calendar with method=REQUEST — and the
      calendar part's raw bytes must be preserved in full. At the iCalendar layer
      the damage is real: "porque esta linea no empieza con espacio" cannot be
      reattached to SUMMARY without guessing, so a correct parser either treats it
      as an unrecognized property and keeps the truncated SUMMARY, or heuristically
      joins it. Both are defensible; hence partial. The hard requirement is that a
      malformed VEVENT must not prevent rendering the message: the text/plain
      alternative and the raw calendar text remain available, and the invite
      degrades to a plain message rather than disappearing.
    subject: "Calendar invite with broken folding"
    parts: 2
    attachments: 0

  - id: real-world-006
    file: 09-real-world/006-html-meta-charset-conflict.eml
    category: real-world
    pathology: >
      An HTML-only message whose body bytes are UTF-8, whose MIME Content-Type
      header declares ISO-8859-1, and whose embedded <meta charset="utf-8">
      contradicts the header; browsers honour the meta tag while RFC 2046 makes
      the MIME header authoritative, so the same bytes render differently
      depending on which layer decodes them.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: partial
    expect_notes: >
      Per RFC 2046 the MIME header WINS: the transport-level charset declaration is
      authoritative over any charset declared inside the payload. The bytes are
      UTF-8 (0xC3 0xB1, 0xC3 0xB3) while the MIME header lies and says ISO-8859-1,
      so a strictly-conforming decode produces mojibake — "El seÃ±or con acciÃ³n."
      — and THAT IS THE CONFORMING RESULT, not a bug. A robust implementation may
      apply the well-known heuristic of validating the bytes as UTF-8 first and, on
      success, preferring UTF-8 (recovering "El señor con acción."); this is what
      most modern clients do and is defensible, but it is a deliberate deviation
      from the RFC and must be a conscious, documented policy rather than an
      accident. Marked partial because the parser must choose between a conforming
      wrong-looking render and a heuristically-repaired one. Non-negotiable: never
      let the in-document <meta> tag override the MIME header silently, and never
      drop the body because the declared decode looks wrong.
    subject: "HTML meta charset contradicts MIME header"
    parts: 1
    attachments: 0

  - id: real-world-007
    file: 09-real-world/007-format-flowed-edges.eml
    category: real-world
    pathology: >
      A text/plain part with format=flowed; delsp=yes exercising every RFC 3676
      edge at once — a soft-wrapped line ending in a space, a space-stuffed line
      that must lose exactly one leading space, and a quoted block that flows —
      where mishandling either strips a real space from the text or leaves ragged
      unwrapped output.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      A correct parser implements RFC 3676: lines ending in a space are flowed into
      the next line and, because delsp=yes, the trailing space is DELETED on join
      (so "flows" and "into" join without a space — a subtle and commonly wrong
      detail); lines not ending in a space are hard breaks; exactly one leading
      space is removed from the space-stuffed line; and the quote-depth-1 block
      flows only into lines of the same quote depth. All content is recoverable, so
      ok. Ignoring format=flowed entirely and showing the raw lines is a visible
      quality defect but not data loss; getting delsp backwards silently corrupts
      the text and is the failure to catch.
    subject: "format=flowed edge cases"
    parts: 1
    attachments: 0

  - id: real-world-008
    file: 09-real-world/008-lying-content-length.eml
    category: real-world
    pathology: >
      A Content-Length: 5 header on a message whose body is far longer — an mbox
      and Netscape-era artifact; RFC 5322 defines no such header for mail, but
      parsers that honour it truncate the body at byte five and lose everything
      after it, or overrun and read into the next message.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      Content-Length has no meaning in RFC 5322/2045 email and MUST be ignored
      entirely. The correct body is both full lines, from "This body is far
      longer..." through "...everything after byte five is lost." Truncating to
      five bytes ("This ") is catastrophic silent data loss and is precisely the
      behavior this case exists to detect. The header should be retained as an
      ordinary unrecognized header, not acted upon.
    subject: "Content-Length header that lies"
    parts: 1
    attachments: 0

  - id: real-world-009
    file: 09-real-world/009-mbox-from-line-leak.eml
    category: real-world
    pathology: >
      An mbox envelope "From " separator line leaked in ahead of the real header
      block, plus an unescaped body line beginning with "From " (the classic >From
      mangling in its ambiguous, un-mangled form); a parser that treats the
      envelope line as the first header can mis-parse or discard the entire header
      block, and an mbox splitter would tear the message in two at the body line.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      A correct parser recognizes a leading "From " line with no colon as an mbox
      envelope artifact and SKIPS it, then parses the real header block normally —
      yielding From: Ada Lovelace, Subject: "mbox From_ line leaked into the
      message", and a two-line body with the second line beginning "From here on".
      The body-position "From " line is ordinary body text and must be preserved
      verbatim; it must never trigger message splitting inside a parser operating
      on a single message. Also defensible: retaining the envelope line as an
      X-Envelope-style pseudo-header for provenance. Unacceptable: consuming the
      envelope line as a malformed header and losing the real From:/Subject:, or
      truncating the body at the second "From ".
    subject: "mbox From_ line leaked into the message"
    parts: 1
    attachments: 0

  - id: real-world-010
    file: 09-real-world/010-long-received-and-references.eml
    category: real-world
    pathology: >
      Realistic list mail with 40 Received headers (each folded across three
      continuation lines) and a References header folded across 200 message-IDs,
      totalling ~12 KB of headers; parsers or storage layers with a header-count,
      header-size, or single-header-length cap silently truncate the References
      chain and break threading.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      Nothing here is malformed — this is legal RFC 5322 with aggressive folding —
      so a correct parser recovers all 40 Received headers with their continuation
      lines unfolded, and all 200 message-IDs from References in order. The
      requirement is the absence of arbitrary limits: no header-count cap, no
      per-header length cap, and unfolding that correctly joins lines beginning
      with TAB. Threading correctness depends on the complete References list, so a
      truncated parse degrades a user-visible feature without any error. Body is
      "Reply in a very long thread."
    subject: "Re: long thread"
    parts: 1
    attachments: 0

  - id: real-world-011
    file: 09-real-world/011-apple-inline-image-in-alternative.eml
    category: real-world
    pathology: >
      Apple Mail's characteristic shape: a multipart/alternative containing
      text/plain, an inline image/jpeg, and text/html in that order — an image
      where RFC 2046 expects only alternative representations of the same content,
      which breaks naive "iterate alternatives and take the last renderable one"
      selection and can make the image vanish or become the chosen body.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      All three leaves must be recovered: text/plain "Text before the image.", the
      inline image/jpeg (filename foto.jpg, base64-decoded), and text/html
      "<p>Text after the image.</p>". Alternative selection must be type-aware —
      choose among the TEXT alternatives (preferring text/html) and never select
      the image as the body — while the image itself must not be discarded just
      because it sits inside an alternative where it does not belong. Because it is
      disposition=inline with a filename and no Content-ID referencing it from the
      HTML, both treatments are defensible: surface it as an attachment (the safer
      default, reflected below) or render it inline alongside the chosen body.
      Unacceptable: dropping the image, or rendering the plain and HTML bodies
      both.
    subject: "Inline image inside multipart/alternative"
    parts: 3
    attachments: 1

  - id: real-world-012
    file: 09-real-world/012-report-missing-type-empty-status.eml
    category: real-world
    pathology: >
      A bounce declared multipart/report with no report-type parameter (required by
      RFC 6522) and a message/delivery-status part that is completely empty, so
      machine classification of the bounce has nothing to key on and a parser
      expecting DSN fields finds none.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: partial
    expect_notes: >
      Structurally the parse must succeed: two children, text/plain "Delivery
      failed." and an empty message/delivery-status. The human-readable
      explanation is fully recovered, so nothing the user needs is lost. Marked
      partial because the machine-readable layer is irrecoverable — with no
      report-type parameter and an empty status part there is no Final-Recipient,
      Action, or Status to extract, so automatic bounce classification must fall
      back to heuristics on the text part or give up. Correct behavior: treat the
      missing report-type as unknown rather than erroring, present the message as
      an ordinary two-part message with a readable body, and do not list the empty
      delivery-status part as an attachment. Rejecting the message for the missing
      required parameter is wrong.
    subject: "multipart/report without report-type"
    parts: 2
    attachments: 0
