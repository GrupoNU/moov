# Moov Mail — pathological MIME corpus manifest
#
# This file is the machine-readable index of testdata/mime-corpus/. It exists
# so the corpus is a SPECIFICATION, not just a pile of broken mail: every case
# records what is wrong with it and what a correct parser is expected to do.
#
# Origin: Spike S4. Rationale in docs/research/04-sync-engine-prior-art.md
# §4.2 and risk R4 — "a message that fails to parse must never break a folder's
# sync". This corpus is how that rule gets tested, and it becomes the permanent
# regression suite of the sync engine's MIME parser.
#
# ---------------------------------------------------------------------------
# IMPORTANT: expectations here were written BEFORE the parsers were ever run.
# ---------------------------------------------------------------------------
# They encode what a correct parser SHOULD do, derived from the RFCs and from
# what the sync engine needs — NOT a prediction of what go-message or enmime
# actually do. Where observed behavior disagrees with an expectation, the
# disagreement is a FINDING to be examined and documented in
# spikes/s4-mime/RESULTS.md, not a reason to quietly edit the expectation.
# If an expectation is ever changed, the reason belongs in the commit message.
#
# ---------------------------------------------------------------------------
# Schema
# ---------------------------------------------------------------------------
#   id           Stable identifier. Never reused, never renumbered.
#   file         Path relative to testdata/mime-corpus/.
#   category     Pathology family (matches the directory name, minus the
#                numeric prefix).
#   pathology    What is broken/extreme, and why it is a realistic hazard.
#   provenance   handcrafted | generated | external
#                  generated   — emitted by spikes/s4-mime/gen (see `generator`)
#                  handcrafted — authored byte by byte
#                  external    — third-party material; see `source` + `license`
#   generator    Path of the generator, for provenance: generated.
#   license      License of the FILE. Project-authored cases are
#                AGPL-3.0-or-later, matching the repository.
#   external     Present and true only for files NOT committed here, which
#                fetch-external.sh downloads at test time.
#   source       Upstream URL, for external cases.
#   expect       ok | partial | failed  (definitions below)
#   expect_notes Prose: what correct output looks like, and — importantly —
#                where more than one behavior is legitimately defensible.
#                Several cases are genuinely ambiguous; the notes say so
#                rather than pretending to a certainty the RFCs do not give.
#   subject      Expected subject AFTER RFC 2047 decoding. Omitted where the
#                header block is malformed enough that extraction is itself
#                the open question.
#   parts        Expected count of LEAF parts (see convention below).
#   attachments  Expected count of user-facing attachments (see convention).
#
# `expect` values:
#   ok       A correct, robust parser extracts everything meaningful. No data
#            loss. Note this includes most MALFORMED input: recovering content
#            from broken mail is correct behavior, not leniency.
#   partial  A correct parser recovers usable content but necessarily loses or
#            guesses something — a truncated message, an undetectable charset
#            lie, an ambiguous structure with two defensible readings.
#   failed   No reasonable parser can extract meaningful structure. The engine
#            marks parse_status='failed', keeps the raw blob, and moves on.
#            Deliberately rare: exactly one case in this corpus qualifies.
#
# ---------------------------------------------------------------------------
# Conventions settled for the whole corpus (arbitrated, not per-case)
# ---------------------------------------------------------------------------
# C1. LEAF PARTS. `parts` counts parts with no children. A message/rfc822 part
#     counts as ONE leaf; the parts of the message it contains are NOT added to
#     the enclosing message's total. Rationale: the embedded message is a
#     distinct entity with its own structure, and flattening its parts into the
#     parent makes the number depend on how deep the parser chose to descend —
#     which is exactly the variable being measured. Two nesting cases
#     (nest-005, nest-006) omit `parts` because their whole point is recursive
#     message/rfc822 descent.
#
# C2. PARSE LAYER, NOT PRESENTATION LAYER. `attachments` counts parts a parser
#     would reasonably report as attachments from the message bytes alone. Where
#     a presentation rule would change the number — e.g. a Content-ID actually
#     referenced by a cid: URL in sibling HTML should be rendered inline rather
#     than listed as an attachment — the entry's expect_notes states both the
#     parse-layer count and the presentation-layer count. Do not treat a
#     mismatch on such a case as a parser defect; treat it as a reminder that
#     the two layers are separate and the policy belongs to the engine.
#
# C3. CONFORMING-BUT-WRONG IS NOT A PARSER BUG. Several charset cases (cs-002,
#     cs-008, cs-003) decode without any error into text that is definitely not
#     what the sender meant, because the declared charset maps every byte. The
#     expectation records that this output is CONFORMING. Improving on it
#     requires heuristic detection, which is an engine decision (research 04
#     §4.2 cascade), not a parser obligation. These cases are flagged in
#     RESULTS.md as the silent-wrong-data class because they are the ones no
#     amount of error handling will catch.
#
# C4. RESOURCE LIMITS ARE A FEATURE. The nesting bombs and the wide/large cases
#     are structurally well formed, so `expect: ok` at the MIME level. An engine
#     that rejects them via a depth cap, a part cap, or a size cap is behaving
#     CORRECTLY — a bounded refusal is a legitimate outcome and the expect_notes
#     say so. What is not acceptable is an unbounded parse: a panic, a hang, or
#     memory growth that takes the process down.
#
# ---------------------------------------------------------------------------
# Safety
# ---------------------------------------------------------------------------
# No real personal data. Every address is under example.com / example.org
# (reserved by RFC 2606) and every name is invented. Binary payloads are
# synthetic stubs with correct magic bytes, never real documents. Nothing here
# is a secret, and nothing here should ever be replaced with a real message
# without sanitizing it first.
#
# Byte fidelity: .eml files are byte-exact vectors. .gitattributes marks *.eml
# as -text so git performs NO end-of-line conversion; .gitignore carries an
# explicit negation for this directory because the repository otherwise ignores
# *.eml. Both are load-bearing — without either one the corpus silently rots.
#
# Regenerate with:  cd spikes/s4-mime/gen && go run . -out ../../../testdata/mime-corpus

cases:
  - id: nest-001
    file: 01-nesting/001-nested-multipart-10.eml
    category: nesting
    pathology: >
      A legal but pathologically deep multipart/mixed tree, ten levels of
      nesting wrapping a single text/plain leaf, which is a realistic hazard
      because a sync engine that recurses without a depth budget turns a
      structurally valid message into unbounded stack and allocation growth.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      Structurally this message is entirely well formed, so a correct parser
      descends all ten levels and yields exactly one text/plain leaf whose body
      is "bottom of the well". Ten is shallow enough that no defensible depth
      cap should trigger here; a parser that refuses this input is too strict.
      The engine should record the nesting depth so that deeper siblings in this
      category can be compared against the same limit.
    subject: "Nested multipart x10"
    parts: 1
    attachments: 0

  - id: nest-002
    file: 01-nesting/002-nested-multipart-50.eml
    category: nesting
    pathology: >
      The same pure-depth multipart/mixed nest taken to fifty levels, which is
      past anything a legitimate MUA emits and is therefore the first point at
      which a sync engine must decide between recursing and refusing.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      At the MIME level this is valid and a correct parser extracts the single
      text/plain leaf with no data loss. It is equally acceptable engine
      behavior to apply a configured depth cap and mark the message
      parse_status='failed' (or 'partial', surfacing the raw blob) rather than
      recurse: a depth cap is a feature, not a parser defect. What is NOT
      acceptable is unbounded recursion, a stack overflow, or a silent hang.
    subject: "Nested multipart x50"
    parts: 1
    attachments: 0

  - id: nest-003
    file: 01-nesting/003-nested-multipart-100.eml
    category: nesting
    pathology: >
      One hundred levels of nested multipart/mixed around a single leaf, a
      shape that only appears in deliberately hostile mail and that exists to
      exhaust a recursive descent parser's stack.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      MIME-correct, so a parser with an iterative or generously bounded
      recursive walker returns the one text/plain leaf intact. A depth limit
      that rejects at this level is legitimate and arguably desirable for a
      production sync engine; if the limit fires, the engine must keep the raw
      blob and mark the message rather than store a truncated tree silently.
      Both outcomes are defensible — what must be measured is that the parse
      terminates in bounded time and memory.
    subject: "Nested multipart x100"
    parts: 1
    attachments: 0

  - id: nest-004
    file: 01-nesting/004-nested-multipart-500.eml
    category: nesting
    pathology: >
      Five hundred levels of nested multipart/mixed, the extreme end of the
      depth bomb, which is the case most likely to crash a naive recursive
      parser outright and therefore the one that proves a depth cap exists.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      Still structurally valid MIME with exactly one meaningful leaf, so a
      resource-unconstrained correct parser produces that leaf. In practice a
      production sync engine SHOULD reject this at a depth cap; treating the
      depth-cap rejection as the expected outcome for this file is acceptable
      and probably preferable. The failure mode this case must rule out is a
      process crash, an OOM, or an unbounded parse time.
    subject: "Nested multipart x500"
    parts: 1
    attachments: 0

  - id: nest-005
    file: 01-nesting/005-rfc822-recursive-5.eml
    category: nesting
    pathology: >
      Five levels of message/rfc822 attachments, each a complete message
      wrapping the next, which is a realistic hazard because forwarded-chain
      mail genuinely takes this shape and a parser that eagerly descends into
      embedded messages multiplies its work and its header extraction at every
      level.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      A correct parser walks five nested message/rfc822 parts and finds one
      innermost text/plain leaf with the body "the innermost payload"; the
      outermost message's own headers (Subject "Wrapper level 1") are the ones
      that belong to the stored message. Two behaviors are defensible for the
      embedded messages, and both are correct as long as the choice is
      consistent: treating each message/rfc822 as an attachment to be listed
      (five attachments) without indexing its interior, or descending fully and
      indexing the innermost text for search. Depth of five is normal enough
      that neither a rejection nor a truncated tree is acceptable here.
    subject: "Wrapper level 1"

  - id: nest-006
    file: 01-nesting/006-rfc822-recursive-20.eml
    category: nesting
    pathology: >
      Twenty levels of recursively wrapped message/rfc822 attachments, past any
      plausible real forward chain, which stresses the multiplicative cost of
      eager descent into embedded messages rather than raw structural depth.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      MIME-valid, so a correct parser can reach the innermost text/plain leaf.
      A separate, lower cap on message/rfc822 descent depth (independent of the
      multipart depth cap) is a legitimate design: stop descending after N
      levels, list the remaining wrapper as an opaque attachment, and mark the
      message partial. The outermost Subject must always be extracted correctly
      regardless of how deep the engine chooses to go.
    subject: "Wrapper level 1"

  - id: nest-007
    file: 01-nesting/007-thousand-sibling-parts.eml
    category: nesting
    pathology: >
      A flat multipart/mixed with one thousand sibling text/plain parts, wide
      rather than deep, which is a realistic hazard for per-part allocation,
      per-part database rows, and any O(n^2) sibling handling in the sync
      engine.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      Perfectly legal MIME. A correct parser enumerates exactly 1000 leaf parts,
      each text/plain with an inline Content-Disposition and filename
      part-0000.txt through part-0999.txt, and body "part number N". A
      per-message part-count cap that truncates the list and marks the message
      partial is acceptable engine policy; if applied, the cap must be recorded
      and the raw blob retained. Storing 1000 rows per message is the real cost
      this case is meant to expose.
    subject: "One thousand sibling parts"
    parts: 1000
    attachments: 0

  - id: nest-008
    file: 01-nesting/008-alternating-alt-related-40.eml
    category: nesting
    pathology: >
      Forty levels alternating multipart/alternative and multipart/related,
      each level carrying its own real text/plain filler part, which is closer
      to the shape of genuinely broken real-world mail than a pure depth bomb
      because meaningful work is done at every level rather than only at the
      leaf.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      Structurally valid. A correct parser yields 41 text/plain leaves: one
      filler leaf per level ("filler text at level N", N from 1 to 40) plus the
      innermost "leaf". The interesting question this case really poses is body
      selection, not enumeration - alternative-selection logic must not loop or
      blow up choosing among 40 nested alternatives, and a defensible engine
      picks the outermost alternative's chosen branch and descends from there.
      A depth cap firing at this level is acceptable engine behavior.
    subject: "Alternating alternative/related x40"
    parts: 41
    attachments: 0

  - id: bnd-001
    file: 02-boundaries/001-unterminated-boundary.eml
    category: boundaries
    pathology: >
      A multipart whose opening delimiter is present but whose closing
      "--boundary--" never arrives before EOF, which is extremely common in
      real mail truncated by an MTA, a disk-full condition, or a partial IMAP
      fetch.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: partial
    expect_notes: >
      A robust parser must treat EOF as an implicit close delimiter and recover
      the single text/plain part with body "this part never gets a closing
      delimiter". Content is fully recovered here, but the message is marked
      partial rather than ok because the parser is guessing at a terminator the
      sender never sent, and because a truncated message may be missing parts
      the engine can never know about. Returning zero parts, or surfacing the
      whole raw body as text, is incorrect.
    subject: "Unterminated boundary"
    parts: 1
    attachments: 0

  - id: bnd-002
    file: 02-boundaries/002-duplicate-close-delimiter.eml
    category: boundaries
    pathology: >
      The closing delimiter appears twice, with text after the second one,
      which is a realistic artifact of message rewriting by gateways and tests
      whether the parser correctly treats everything after the first terminator
      as epilogue.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      Per RFC 2046 the first close delimiter ends the multipart; everything
      after it, including the second "--=_d_=--" line and the "trailing
      epilogue after a second terminator" text, is epilogue and MUST be
      discarded. A correct parser produces exactly one text/plain part with
      body "first and only real part". Surfacing the epilogue text as a second
      part or appending it to the body is a defect - it leaks non-content into
      the reading pane and into the search index.
    subject: "Duplicated close delimiter"
    parts: 1
    attachments: 0

  - id: bnd-003
    file: 02-boundaries/003-child-reuses-parent-boundary.eml
    category: boundaries
    pathology: >
      A nested multipart/alternative declares the same boundary string as its
      multipart/mixed parent, which RFC 2046 forbids and which makes the tree
      genuinely ambiguous because the parent's delimiter also terminates the
      child; real parsers disagree wildly on the resulting structure.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: partial
    expect_notes: >
      There is no single correct tree here, so any parser necessarily guesses.
      The mandatory outcome is that the text "inner plain" is recovered and
      reachable as body content, and that the parse terminates without looping.
      Two defensible readings: (a) the innermost delimiter closes the child, so
      the child is a multipart/alternative containing one text/plain and the
      parent contains that child; (b) the shared delimiter is consumed by the
      parent, so the child multipart/alternative appears empty and the
      text/plain becomes a sibling of it under the parent. Either is acceptable;
      marking the message partial and preserving the raw blob is required
      because the structure the sender intended cannot be known. Losing "inner
      plain" entirely is a defect.
    subject: "Child reuses parent boundary"

  - id: bnd-004
    file: 02-boundaries/004-boundary-trailing-garbage.eml
    category: boundaries
    pathology: >
      The opening delimiter line carries trailing non-whitespace bytes
      ("--=_g_= XXXX"), which RFC 2046 says disqualifies it as a delimiter,
      meaning a strict reading turns the entire intended part into preamble and
      silently drops the user's message text.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: partial
    expect_notes: >
      Strict RFC 2046 conformance yields a multipart with zero parts and the
      text "is this a part or is it preamble?" living in the preamble, which is
      discarded - a silent data loss that no user would accept. The preferred
      robust behavior is to accept the line as a delimiter after stripping the
      trailing garbage and recover one text/plain part. Both readings are
      defensible on standards grounds, but an engine that produces zero
      recoverable body text MUST mark the message partial and retain the raw
      blob so nothing is lost; it must never present an apparently-empty
      message as a clean parse.
    subject: "Boundary with trailing garbage"

  - id: bnd-005
    file: 02-boundaries/005-boundary-never-appears.eml
    category: boundaries
    pathology: >
      A Content-Type declares multipart/mixed with a boundary that appears
      nowhere in the body, so a strict reading yields a multipart with zero
      parts and no displayable content at all - a realistic result of a
      header-rewriting gateway or a truncated body.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: partial
    expect_notes: >
      Strictly the whole body is preamble and the message has zero parts. A
      robust parser should not render an empty message: the defensible recovery
      is to treat the undelimited body as a single implicit text/plain part so
      the two lines of text are readable and indexable. Either behavior is
      acceptable provided the message is marked partial and the raw blob is
      retained; presenting an empty body with parse_status='ok' is the one
      outcome that is wrong.
    subject: "Boundary declared but absent"

  - id: bnd-006
    file: 02-boundaries/006-preamble-and-epilogue.eml
    category: boundaries
    pathology: >
      A well-formed multipart carrying both a preamble before the first
      delimiter and an epilogue after the last, which is entirely legal and
      ubiquitous, and which catches parsers that leak "This is a multi-part
      message in MIME format." into the user's reading pane and the search
      index.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      A correct parser produces exactly one text/plain part with body "the
      actual body". Both PREAMBLE-MARKER-SHOULD-NOT-APPEAR-AS-BODY and
      EPILOGUE-MARKER-SHOULD-NOT-APPEAR-AS-BODY must be absent from the
      extracted body, from the list-view snippet, and from the full-text index.
      Those two marker strings make this case directly assertable: their
      presence anywhere in the parsed output is a failure.
    subject: "Preamble and epilogue"
    parts: 1
    attachments: 0

  - id: bnd-007
    file: 02-boundaries/007-unquoted-boundary-with-space.eml
    category: boundaries
    pathology: >
      The boundary parameter contains a space but is written unquoted
      (boundary==_a b_=), so a conformant RFC 2045 parameter parser stops at
      the space and derives the boundary "=_a" - which then matches nothing,
      silently emptying the message.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: partial
    expect_notes: >
      Strict parsing gives boundary "=_a", no delimiter matches, and the body
      becomes preamble: zero parts and no readable content. The pragmatic
      recovery, which several real MUAs implement, is to take the rest of the
      parameter value up to end-of-line as the boundary, yielding one
      text/plain part with body "part under an unquoted boundary with a space".
      The lenient reading is preferable because it recovers the user's text;
      the strict reading is defensible but must then mark the message partial
      and keep the raw blob. Note the value also begins with "=" immediately
      after "boundary=", so the parameter parser must not choke on the double
      equals.
    subject: "Unquoted boundary containing a space"

  - id: bnd-008
    file: 02-boundaries/008-boundary-prefix-collision.eml
    category: boundaries
    pathology: >
      The outer boundary "=_x_=" is a strict prefix of the inner boundary
      "=_x_=inner", so a splitter that matches delimiters by prefix rather than
      by whole line mis-slices the message and shreds the inner multipart.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      This message is legal MIME: RFC 2046 requires a delimiter line to consist
      of the boundary followed only by optional linear whitespace (or "--" for
      the close), so "--=_x_=inner" is NOT an occurrence of the outer boundary.
      A correct parser produces an outer multipart/mixed containing one inner
      multipart/mixed containing one text/plain leaf with body "inner part".
      The characteristic defect this case detects is a prefix-matching splitter
      that treats "--=_x_=inner" as an outer delimiter and loses the inner
      part's headers or body.
    subject: "Boundary is a prefix of the inner boundary"
    parts: 1
    attachments: 0

  - id: bnd-009
    file: 02-boundaries/009-close-delimiter-missing-hyphens.eml
    category: boundaries
    pathology: >
      The close delimiter is written "=_h_=--" without its mandatory leading
      two hyphens, so no valid terminator exists and the multipart runs to EOF
      - the same recovery path as a truncated message but triggered by a
      generator bug rather than truncation.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: partial
    expect_notes: >
      "=_h_=--" is not a delimiter line, so a correct parser treats it as
      ordinary body text of the open part and closes that part at EOF. Expected
      output is one text/plain part whose body is "body" followed by the
      literal line "=_h_=--". A parser that leniently accepts the hyphen-less
      line as a terminator and drops it is also defensible and arguably nicer
      for the user; either way exactly one part must be recovered and no text
      silently vanish. Partial rather than ok because the terminator is
      inferred.
    subject: "Close delimiter without leading hyphens"
    parts: 1
    attachments: 0

  - id: bnd-010
    file: 02-boundaries/010-empty-boundary-parameter.eml
    category: boundaries
    pathology: >
      The boundary parameter is the empty string, so the delimiter degenerates
      to the two-character line "--" and the terminator to "----", meaning any
      signature separator or ASCII rule in the body becomes a structural
      delimiter - a realistic false-positive engine for real mail.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: partial
    expect_notes: >
      RFC 2046 requires a boundary of 1 to 70 characters, so an empty boundary
      is illegal and two readings are defensible. Lenient: accept it, treat "--"
      as the delimiter and "----" as the terminator, and recover one text/plain
      part with body "body under an empty boundary". Strict: reject the
      boundary parameter as invalid, treat the whole body as an undelimited
      single part, and surface the raw text. The lenient reading recovers more
      and is preferred; the strict one must mark the message partial. What the
      engine must not do is accept an empty boundary and then apply the same
      lenient "--" matching to unrelated messages.
    subject: "Empty boundary parameter"

  - id: hdr-001
    file: 03-headers/001-single-20kb-header.eml
    category: headers
    pathology: >
      A single unfolded 20 KB header line, twenty times the RFC 5322 998-octet
      line limit, which real mail produces constantly through long References
      chains, DKIM signatures, and spam-scanner verdicts, and which truncates
      or errors out any parser with a fixed line buffer.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      A correct parser reads the full X-Huge-Header value (20480 'A'
      characters) without truncation, and correctly parses every header after
      it, including the Content-Type, plus the body "body after a 20KB header".
      A per-header size cap that truncates the oversized value while keeping
      all other headers and the body intact is acceptable engine policy and
      should be recorded; silently dropping the header, corrupting the headers
      that follow it, or failing the whole message are all defects.
    subject: "Single 20KB header line"
    parts: 1
    attachments: 0

  - id: hdr-002
    file: 03-headers/002-ten-thousand-headers.eml
    category: headers
    pathology: >
      Ten thousand short X-Trace headers ahead of the Content-Type, which
      exposes memory pressure and any O(n^2) header lookup or insertion in the
      parser, a realistic shape for mail that has traversed long scanning
      chains.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      Every header is individually well formed, so a correct parser reads all
      10000 X-Trace-NNNNN headers plus the six standard headers, honours the
      trailing Content-Type, and returns the body "body after 10000 headers".
      A header-count cap that stops storing beyond N headers while still
      parsing the message body correctly is acceptable engine behavior, as is
      persisting only a whitelist of headers - the sync engine has no reason to
      store 10000 trace hops. The parse must complete in time linear in the
      header count.
    subject: "Ten thousand headers"
    parts: 1
    attachments: 0

  - id: hdr-003
    file: 03-headers/003-raw-8bit-header-bytes.eml
    category: headers
    pathology: >
      Raw 8-bit bytes in header values with no RFC 2047 encoding - the Subject
      holds UTF-8 "Anoranza senor" and X-Latin1-Subject the same text in
      ISO-8859-1 - which is illegal but ubiquitous because many MUAs simply
      emit the local charset, and which forces the parser to guess an encoding
      it was never told.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      A correct parser must not reject the message and must not mangle the
      header into replacement characters wholesale. The expected behavior is to
      try UTF-8 first and fall back to a Latin-1-family charset when the bytes
      are not valid UTF-8: the Subject bytes are valid UTF-8 and MUST decode to
      the Spanish text with n-tilde intact, while X-Latin1-Subject is invalid
      UTF-8 and should fall back to ISO-8859-1 (or CP1252) to produce the same
      text. Using the body part's charset as the fallback hint is also
      defensible. The subject key is omitted here deliberately: the decoded
      string contains non-ASCII that must be compared byte-exactly by the test
      harness rather than transcribed into this manifest.
    parts: 1
    attachments: 0

  - id: hdr-004
    file: 03-headers/004-folded-mixed-tabs-spaces.eml
    category: headers
    pathology: >
      Headers folded across multiple lines with inconsistent leading
      whitespace - tabs, multiple spaces, and mixed tab-space-tab runs - which
      is legal RFC 5322 folding but which trips parsers that only recognise a
      single leading space, causing address lists and subjects to be silently
      truncated at the first fold.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      All folds here are valid: any line beginning with SP or HTAB continues
      the previous header. A correct parser unfolds the To header into four
      recipients (Grace Hopper, Alan Turing, Katherine Johnson, plus the name
      on the first line) and unfolds the Subject across its four lines. Per RFC
      5322 unfolding removes the CRLF and keeps the whitespace, so the
      canonical Subject is "folded\tsubject   across\t\tfour lines"; collapsing
      each whitespace run to a single space when displaying is a defensible
      normalization. The subject key is omitted because the exact whitespace
      the harness should assert depends on that normalization choice. A parser
      that reads Subject as just "folded" has the defect this case targets.
    parts: 1
    attachments: 0

  - id: hdr-005
    file: 03-headers/005-header-missing-colon.eml
    category: headers
    pathology: >
      A line with no colon ("ThisLineHasNoColonAtAll") sits in the middle of an
      otherwise valid header block, which is neither a header nor a fold
      continuation, and which can make a strict parser abandon the header block
      at that point and lose the Content-Type that follows.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: partial
    expect_notes: >
      The robust and preferred behavior is to skip the malformed line and
      continue parsing headers, so Content-Type is honoured and the body is
      "does the parser drop the bad line, or abandon the header block?". A
      defensible stricter reading treats the colon-less line as the start of
      the body, which makes the remaining Content-Type line body text and gives
      the message a default text/plain type - still readable, but with the
      Content-Type lost. Marked partial because the bad line itself is
      discarded or reinterpreted either way. Losing the Subject or the From, or
      failing the message outright, is not acceptable.
    subject: "Header line without a colon"

  - id: hdr-006
    file: 03-headers/006-duplicate-contenttype-disagree.eml
    category: headers
    pathology: >
      Two Content-Type headers that disagree, text/plain then text/html, where
      RFC 5322 permits at most one; the choice is a genuine security question
      because rendering HTML that the sender labelled text/plain (or vice
      versa) is a content-sniffing confusion vector.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: partial
    expect_notes: >
      The message is ambiguous by construction, so a correct parser must pick
      deterministically and document the choice. The safer and recommended rule
      is first-header-wins, yielding text/plain and displaying
      "<b>Is this HTML or plain text?</b>" as literal escaped text rather than
      as markup. Last-header-wins is what several MUAs do and is defensible,
      but then the body MUST go through the full HTML sanitization pipeline.
      The unacceptable outcomes are choosing non-deterministically, or choosing
      text/plain for the type record while still rendering the body as HTML.
    subject: "Two disagreeing Content-Type headers"
    parts: 1
    attachments: 0

  - id: hdr-007
    file: 03-headers/007-eof-in-headers.eml
    category: headers
    pathology: >
      The file ends mid-header, in the middle of the token "Content-Type:
      text/pla", with no blank line and no body, which is exactly what a
      connection drop or a disk-full write during message delivery produces.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: partial
    expect_notes: >
      A correct parser treats EOF as terminating the header block and recovers
      the four complete headers - From, To, Subject, Date - plus a final
      truncated Content-Type whose value is the fragment "text/pla". The body
      is empty. Two defensible treatments of the truncated header: keep it with
      its partial value, or discard it as unparseable; discarding is safer
      because "text/pla" is not a valid media type and must not be used for
      dispatch, so the part should fall back to text/plain. The message must be
      marked partial and the raw blob retained, since the real message
      continues past this byte. Returning zero headers is a defect - Subject
      and From are fully present and must be indexed.
    subject: "truncated in the header block"
    parts: 0
    attachments: 0

  - id: hdr-008
    file: 03-headers/008-whitespace-only-separator.eml
    category: headers
    pathology: >
      The header block is terminated by a line containing a single space rather
      than a truly empty line, which strictly is a fold continuation meaning
      the headers never end, but which many MUAs emit and treat as the
      separator - so the body text either becomes part of the Content-Type
      value or becomes the body, with no way to tell which the sender meant.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: partial
    expect_notes: >
      Two defensible readings, both of which must recover the text. Strict RFC
      5322: the " " line folds into Content-Type, and so does the following
      line, giving a mangled Content-Type value and a message with no body at
      all - a bad user outcome. Lenient and preferred: treat a whitespace-only
      line as the header/body separator, giving Content-Type
      "text/plain; charset=us-ascii" and body "is this line body, or a
      continuation of Content-Type?". The lenient reading is recommended
      because the strict one loses the user's only text. Either way the message
      is partial, since the parser is resolving an ambiguity the sender created.
    subject: "Whitespace-only line as separator"

  - id: hdr-009
    file: 03-headers/009-leading-continuation-line.eml
    category: headers
    pathology: >
      The very first line of the message is a fold continuation with no
      preceding header to continue, a classic artifact of naive header
      stripping or of a prepended banner, which can make a parser treat the
      entire message as bodiless or misattribute the orphan text to the From
      header.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: partial
    expect_notes: >
      A correct parser discards the orphaned continuation line (there is no
      header for it to belong to) and parses the remaining block normally,
      yielding From, To, Subject "Leading continuation line", the Content-Type,
      and body "body". Storing the orphan line as a synthetic header, or
      ignoring it entirely, are both acceptable; attaching its text to the
      following From header is a defect, as is bailing out of header parsing on
      the first line and treating the whole message as body. Partial because
      one line of input is necessarily discarded or guessed at.
    subject: "Leading continuation line"
    parts: 1
    attachments: 0

  - id: hdr-010
    file: 03-headers/010-malformed-header-names.eml
    category: headers
    pathology: >
      Three malformed header names in one block - "Subject : x" with a space
      before the colon (illegal, since RFC 5322 field names may not contain
      whitespace), ": empty header name" with no name at all, and
      "X-Empty-Value:" with an empty value - which together decide whether the
      message's Subject is extractable at all.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: partial
    expect_notes: >
      "X-Empty-Value:" is legal and must parse to an empty string, not be
      dropped. The other two are illegal and a correct parser has two
      defensible options for each: skip the line, or repair it by trimming
      whitespace before the colon. The preferred behavior is to trim and accept
      "Subject : space before colon" as Subject "space before colon", because
      dropping it loses the only Subject the message has, and to discard the
      nameless ": empty header name" line since there is no key to file it
      under. Under the strict reading the message has no Subject at all. The
      subject key is omitted here precisely because extractability is the thing
      under arbitration. From, Date, Message-ID, MIME-Version, Content-Type and
      the body "body" must all survive regardless of which reading is chosen.

  - id: hdr-011
    file: 03-headers/011-no-headers-at-all.eml
    category: headers
    pathology: >
      A message that begins with the blank line and has no headers whatsoever -
      no From, no Date, no Message-ID - which occurs with locally injected mail
      and with badly reconstructed messages, and which breaks any code path
      that assumes a Message-ID or a sender exists.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      This parses cleanly under RFC 5322's grammar for a message with an empty
      header section: zero headers, and body "just a body, no headers, not even
      From". A correct parser returns an empty header set and the body intact,
      with the media type defaulting to text/plain; charset=us-ascii per RFC
      2045. The real requirement this case enforces is downstream: the sync
      engine must synthesize a stable identity (Message-ID, sender, date) or
      tolerate their absence without crashing or writing NULLs into NOT NULL
      columns. Rejecting the message is not acceptable - it is structurally
      valid.
    parts: 1
    attachments: 0

  - id: le-001
    file: 08-line-endings/001-lf-only.eml
    category: line-endings
    pathology: >
      The entire message uses bare LF line endings rather than CRLF, which is
      the normal on-disk form of virtually every Unix mailbox and Maildir file,
      so a parser that keys strictly on CRLF sees one enormous line and finds
      no headers and no boundaries at all.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      This MUST parse. LF-only is not an edge case for a Dovecot-backed sync
      engine, it is the common case on disk, and a CRLF-strict parser is simply
      broken for this input. A correct parser normalizes bare LF to a line
      break and yields a multipart/mixed with exactly two text/plain leaves,
      bodies "first part body" and "second part body". Note the file has no
      trailing newline after the final "--=_le_=--" delimiter, which must not
      prevent recognition of the terminator. Anything other than a clean
      two-part parse here is a defect, not a defensible strictness choice.
    subject: "Line ending variants"
    parts: 2
    attachments: 0

  - id: le-002
    file: 08-line-endings/002-cr-only.eml
    category: line-endings
    pathology: >
      The entire message uses bare CR line endings (classic Mac OS), so to any
      CRLF- or LF-oriented parser the file is a single 401-byte line with no
      header/body separator and no delimiter lines anywhere - genuinely hostile
      input rather than a common encoding accident.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: partial
    expect_notes: >
      Unlike LF-only, CR-only is not something a mail parser is obliged to
      support, and treating the message as one unparseable line is defensible.
      Two acceptable outcomes: (a) recognize that the buffer contains CR but no
      LF and normalize CR to line breaks, producing the same clean two-part
      parse as le-001 - the most user-friendly result; (b) fail to find a
      header block, mark the message partial or failed, and retain the raw blob
      so nothing is lost. What is NOT acceptable is producing a message whose
      single "Subject" or "body" is the entire 401-byte blob presented as
      though it parsed cleanly, or feeding that blob into the search index as
      body text. A CR-only heuristic must be narrowly scoped - applied only
      when the buffer contains CR and no LF at all - so it never corrupts the
      bare-CR-in-body case (le-010).
    parts: 2
    attachments: 0

  - id: le-003
    file: 08-line-endings/003-mixed-crlf-lf.eml
    category: line-endings
    pathology: >
      Line endings alternate between CRLF and bare LF from one line to the
      next, including within the header block and on delimiter lines, which
      real mail produces when different agents rewrite different parts of a
      message and which defeats any parser that decides the message's line
      ending once and applies it globally.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      A correct parser treats CRLF and bare LF interchangeably as line
      terminators on a per-line basis rather than sniffing a single convention
      for the whole message. Expected output is a multipart/mixed with two
      text/plain leaves, bodies "first part body" and "second part body", and
      all six standard headers intact. Note that the header/body separator here
      is an LF-terminated empty line following a CRLF-terminated line, so the
      separator detection must accept the mixed sequence; a parser looking
      strictly for CRLFCRLF finds no header block at all.
    subject: "Line ending variants"
    parts: 2
    attachments: 0

  - id: le-004
    file: 08-line-endings/004-crlf-headers-lf-body.eml
    category: line-endings
    pathology: >
      Headers are CRLF-terminated while the entire body uses bare LF, which is
      the single most common real-world line-ending mix because an MTA
      normalizes the headers it rewrites while the original body passes through
      untouched.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      This MUST parse cleanly - it is ordinary production mail, not a
      pathology. The header block ends at a proper CRLFCRLF, and the body's
      LF-terminated delimiter lines must still be recognized as delimiters.
      Expected output is two text/plain leaves with bodies "first part body"
      and "second part body". A parser that matches delimiters only when
      preceded and followed by CRLF finds zero parts here and loses the entire
      message body; that is the defect this case exists to catch. The file also
      ends without a trailing newline after the final delimiter.
    subject: "Line ending variants"
    parts: 2
    attachments: 0

  - id: le-005
    file: 08-line-endings/005-lf-delimiters-crlf-body.eml
    category: line-endings
    pathology: >
      The boundary delimiter lines alone are LF-terminated while every other
      line, including the part headers and part bodies, uses CRLF - the
      inverse mix, which isolates delimiter matching from body handling and
      catches a parser whose boundary regex hardcodes CRLF.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      A correct parser recognizes a delimiter line regardless of whether it
      ends in CRLF or LF, producing two text/plain leaves with bodies "first
      part body" and "second part body". A CRLF-strict delimiter matcher finds
      no parts and yields an empty multipart - full body loss on a message
      whose text is otherwise perfectly well formed. Note that the CRLF
      preceding each LF-terminated delimiter belongs to the previous part's
      body and must be stripped as part of the delimiter, not retained as
      trailing content.
    subject: "Line ending variants"
    parts: 2
    attachments: 0

  - id: le-006
    file: 08-line-endings/006-b64-misaligned-crlf.eml
    category: line-endings
    pathology: >
      A base64 stream with CRLF inserted every seven characters, deliberately
      not aligned to base64's four-character groups, which RFC 2045 explicitly
      permits since all whitespace in the encoded stream is ignored, but which
      breaks naive chunked decoders that assume each line is independently
      decodable.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      Fully legal input. A correct decoder strips all whitespace from the
      encoded stream before decoding, recovering the plaintext exactly - the
      string "misaligned base64 stream. " repeated twenty times, 520 bytes. The
      characteristic defect is a decoder that calls base64 decode per line and
      either errors on non-multiple-of-four input or silently drops the
      remainder of each line, corrupting the output. Because the plaintext is a
      known repeating string, the harness can assert byte equality rather than
      merely "did not error".
    subject: "base64 with CRLF at misaligned positions"
    parts: 1
    attachments: 0

  - id: le-007
    file: 08-line-endings/007-nul-bytes-in-headers.eml
    category: line-endings
    pathology: >
      NUL bytes appear both inside a header value (the Subject) and inside a
      header name ("X-Nul-Header\0:"), which is illegal in RFC 5322 and which
      is a realistic hazard because NUL cannot be stored in a PostgreSQL text
      column and because a C-string-based downstream consumer will silently
      truncate at the first NUL.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: partial
    expect_notes: >
      A correct parser must not truncate at the NUL and must not reject the
      message. The Subject value should be read as the full byte sequence
      "NUL\0byte\0in\0subject", with the NULs then stripped or replaced (with
      U+FFFD) before the value reaches PostgreSQL - stripping yields
      "NULbyteinsubject". The malformed field name X-Nul-Header\0 may be
      dropped or sanitized; either is acceptable. Marked partial because bytes
      are necessarily removed or substituted somewhere in the pipeline. The
      subject key is omitted because the stored value depends on whether the
      engine strips or substitutes. The remaining headers and the body "body"
      must be unaffected.

  - id: le-008
    file: 08-line-endings/008-nul-bytes-in-body.eml
    category: line-endings
    pathology: >
      NUL bytes inside a text/plain UTF-8 body ("before\0after\0\0end"), which
      is as much a storage test as a parser test: PostgreSQL text columns
      cannot hold U+0000, so the sync engine must strip or substitute them
      before insert or the write fails at runtime on real mail.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: partial
    expect_notes: >
      The MIME structure is trivially valid and a correct parser returns one
      text/plain part whose raw bytes include the three NULs. The required
      behavior is at the storage boundary: NULs must be removed or replaced
      before the body text is written to a Postgres text column or fed to the
      FTS indexer, giving "beforeafterend" (strip) or a U+FFFD-substituted
      equivalent. Either is acceptable if consistent. Marked partial because
      the stored text necessarily differs from the wire bytes; the raw blob,
      which is stored as bytea, must retain the NULs so the original message
      can always be reproduced byte-exactly.
    subject: "NUL bytes in a text body"
    parts: 1
    attachments: 0

  - id: le-009
    file: 08-line-endings/009-no-trailing-newline.eml
    category: line-endings
    pathology: >
      An otherwise perfectly well-formed CRLF message whose final close
      delimiter "--=_le_=--" is not followed by any line ending, hitting EOF
      mid-line, which is common in files produced by naive concatenation and
      which breaks parsers that only recognize a delimiter when it is
      terminated by a line break.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      EOF is a valid line terminator for the purposes of delimiter recognition,
      so a correct parser recognizes the final close delimiter and produces two
      text/plain leaves with bodies "first part body" and "second part body" -
      identical output to the CRLF baseline. A parser that misses the
      terminator still recovers both parts by closing the last one at EOF, so
      the observable result should be the same; the defect to watch for is the
      literal text "--=_le_=--" leaking into the second part's body.
    subject: "Line ending variants"
    parts: 2
    attachments: 0

  - id: le-010
    file: 08-line-endings/010-bare-cr-in-body.eml
    category: line-endings
    pathology: >
      A lone CR sits in the middle of a body line, not followed by LF, inside
      an otherwise CRLF-clean message, which is realistic in text pasted from
      mixed-platform sources and which is dangerous because a parser that
      normalizes all CR to line breaks silently splits one logical line into
      two and shifts every downstream offset.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      The message is structurally valid: one text/plain part whose body is
      "line with a bare\rcarriage return in the middle" followed by "normal
      line". The correct behavior is to treat only CRLF (and, leniently, bare
      LF) as line terminators and to preserve the interior bare CR as a literal
      body byte. Converting it to a line break is a defensible display-layer
      choice but must not happen during structural parsing. This case is the
      guard rail on any CR-only normalization heuristic added for le-002: that
      heuristic must be scoped to buffers containing no LF at all, or it will
      corrupt this message.
    subject: "Bare CR inside the body"
    parts: 1
    attachments: 0

  - id: le-011
    file: 08-line-endings/011-megabyte-single-line.eml
    category: line-endings
    pathology: >
      A one-megabyte body consisting of a single line with no internal line
      break, far past the RFC 5322 998-octet limit, which is realistic for
      machine-generated mail and single-line HTML and which exhausts any parser
      holding a fixed-size line buffer or scanning quadratically for a
      terminator.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      A correct parser returns one text/plain part whose body is exactly
      1048576 'x' characters, with no truncation and no quadratic blowup. A
      body-size or line-length cap that truncates the stored text while
      retaining the full raw blob is acceptable engine policy provided the
      truncation is recorded and the message is then marked partial; silently
      truncating with parse_status='ok' is a defect. The parse must be linear
      in input size - this file is the one in this category where a slow
      implementation shows up as a timing regression rather than a wrong answer.
    subject: "One megabyte body line with no break"
    parts: 1
    attachments: 0
  - id: ew-001
    file: 04-encoded-words/001-split-multibyte-b64.eml
    category: encoded-words
    pathology: >
      A single UTF-8 character has its two bytes split across two adjacent
      base64 encoded-words. RFC 2047 forbids this explicitly, and MUAs that fold
      headers at a fixed byte count produce it constantly.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      A robust decoder concatenates the decoded BYTES of adjacent encoded-words
      that share a charset, and only then converts to text — which recovers the
      subject exactly. A decoder that converts each encoded-word to text
      independently sees a truncated sequence in word 1 and an orphan
      continuation byte in word 2, and yields two U+FFFD replacement characters
      around the accent. Both are seen in the wild; only the first is correct.
      This is the single most valuable case in the category.
    subject: "Presupuesto acción ñandú"
    parts: 1
    attachments: 0

  - id: ew-002
    file: 04-encoded-words/002-split-multibyte-q.eml
    category: encoded-words
    pathology: >
      Same split-multibyte pathology as ew-001 but in Q-encoding, with =C3 in
      one encoded-word and =B3 in the next.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      Identical reasoning to ew-001: correct output requires byte-level
      concatenation before charset conversion. Note the underscore in
      "Presupuesto_acci" must decode to a space, not an underscore.
    subject: "Presupuesto acción"
    parts: 1
    attachments: 0

  - id: ew-003
    file: 04-encoded-words/003-wrong-charset-declared.eml
    category: encoded-words
    pathology: >
      The encoded-word's payload bytes are UTF-8 but the word declares
      ISO-8859-1. The declaration is a lie and nothing in the message reveals it.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: partial
    expect_notes: >
      The strictly conforming result is mojibake ("AcciÃ³n requerida") and NO
      error: ISO-8859-1 decodes every byte, so there is nothing to detect at the
      charset layer. Producing that mojibake is CONFORMING, not a bug. Moov's
      documented cascade (research 04 §4.2) may additionally notice that the raw
      bytes are valid UTF-8 and prefer that reading, marking the field
      charset_guessed; that is the better product behavior. Either output is
      acceptable here, but a parser must not report success WITHOUT signalling
      that the charset was untrustworthy — silent mojibake with no flag is the
      failure mode this case exists to catch.
    parts: 1
    attachments: 0

  - id: ew-004
    file: 04-encoded-words/004-b64-bad-padding.eml
    category: encoded-words
    pathology: >
      Base64 encoded-word with its '=' padding stripped, so the payload length
      is not a multiple of 4.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      Unpadded base64 is unambiguously decodable (raw-encoding semantics), so a
      robust decoder recovers "Reunión mensual" in full. A decoder that insists
      on padding errors out and should then fall back to showing the raw
      encoded-word text rather than an empty subject. An empty subject is the
      unacceptable outcome.
    subject: "Reunión mensual"
    parts: 1
    attachments: 0

  - id: ew-005
    file: 04-encoded-words/005-oversized-encoded-word.eml
    category: encoded-words
    pathology: >
      One encoded-word of roughly 6,500 characters on a single unfolded line,
      against RFC 2047's 75-character limit and RFC 5322's 998-octet line limit.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      Nothing is ambiguous here; the only hazard is a fixed-size line or token
      buffer. Correct output is the fully decoded 4,800-character subject. A
      parser that truncates at a buffer boundary is silently losing data and
