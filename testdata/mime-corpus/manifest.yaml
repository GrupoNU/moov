  - id: cte-001
    file: 06-cte/001-declared-b64-actual-text.eml
    category: cte
    pathology: >
      The part declares Content-Transfer-Encoding: base64 but the body is ordinary
      English prose containing spaces, punctuation and '!', so base64 decoding
      fails outright; senders that mislabel CTE are common enough that a sync
      engine which trusts the declaration will index and store an empty body.
    provenance: generated
    generator: spikes/s4-mime/gen
    license: AGPL-3.0-or-later
    expect: ok
    expect_notes: >
      The ROBUST and correct behavior is to attempt the base64 decode, detect the
      failure (invalid alphabet characters / no meaningful output), and FALL BACK
      to treating the raw body bytes as text — yielding both prose lines intact.
