blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/GrupoNU/moov/security/advisories/new
    about: >
      Report it privately through a GitHub Security Advisory. Never in a public
      issue.
  - name: Question or idea
    url: https://github.com/GrupoNU/moov/discussions
    about: >
      For questions, half-formed ideas and general conversation. Issues are for
      actionable bugs and concrete proposals.
  - name: Architecture and specifications
    url: https://github.com/GrupoNU/moov/tree/main/docs
    about: >
      ADR-001, the phase specification and the four validation spikes. Worth a
      read before proposing a design change.
